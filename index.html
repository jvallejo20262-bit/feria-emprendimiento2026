<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F5F8;--card:#fff;--ink:#0F172A;--mut:#64748B;--pri:#4338CA;--acc:#0EA5E9;--mint:#059669;--sun:#D97706;--red:#DC2626;--line:#E2E8F0;--sh:0 1px 2px rgba(15,23,42,.05),0 1px 3px rgba(15,23,42,.04);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1020;--card:#131A2E;--ink:#F1F5F9;--mut:#94A3B8;--pri:#818CF8;--line:#1F2A44;--sh:none}}
:root[data-theme="dark"]{--bg:#0B1020;--card:#131A2E;--ink:#F1F5F9;--mut:#94A3B8;--pri:#818CF8;--line:#1F2A44;--sh:none}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
h1,h2,h3{margin:0 0 12px;letter-spacing:-.015em;font-weight:700}
h2{font-size:24px}h3{font-size:16px}
button{font:inherit;color:inherit;cursor:pointer}
.ic{display:inline-block;vertical-align:-.2em;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line)}
.logo img{width:100%;height:100%;object-fit:cover;display:block}.logo{overflow:hidden;width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--pri),var(--acc));color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.brand{display:none}.brand small,.top small{display:block;color:var(--mut);font-size:12px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs{display:flex}
nav button{flex:1;border:0;background:none;padding:9px 2px 8px;font-size:11px;font-weight:600;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px}
nav button.on{color:var(--pri)}
main{max-width:1080px;margin:0 auto;padding:20px 16px 110px}
.card{background:var(--card);border-radius:14px;padding:18px;margin-bottom:14px;border:1px solid var(--line);box-shadow:var(--sh)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:14px}
.grid .card{margin:0}
.kpi small{color:var(--mut);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em;display:block}
.kpi b{font-size:24px;font-weight:700;display:block;margin-top:4px;letter-spacing:-.02em}
.hero{background:linear-gradient(135deg,#312E81,var(--pri) 60%,#0284C7);color:#fff;border:0}
.hero small{opacity:.8;font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}.hero b{font-size:40px;font-weight:700;display:block;letter-spacing:-.03em;margin:2px 0 12px}
.btn{border:0;border-radius:10px;padding:12px 18px;font-weight:600;background:var(--pri);color:#fff;min-height:46px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:filter .15s}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--red)}.btn.mint{background:var(--mint)}.btn.sm{padding:7px 12px;min-height:36px;font-size:13px;border-radius:9px}
.btn.light{background:#fff;color:var(--pri)}.btn:disabled{opacity:.4}
.btn.big{width:100%;font-size:16px;min-height:52px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1}.row .btn{flex:1 1 auto}
.ln{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:8px 0}
.ln.tot{border-top:1px solid var(--line);margin-top:6px;padding-top:12px;font-weight:700;font-size:17px}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 12px;min-height:46px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--pri);outline-offset:1px}
label{display:block;font-weight:600;font-size:13px;color:var(--mut);margin:12px 0 5px}
.mut{color:var(--mut)}.bad{color:var(--red);font-weight:700}.good{color:var(--mint);font-weight:700}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.pick{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:2px;box-shadow:var(--sh)}
.pick.on{border-color:var(--pri);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 22%,transparent)}
.pick:disabled{opacity:.45}.pick small{color:var(--mut)}
.th{width:48px;height:48px;border-radius:12px;background:var(--bg);display:grid;place-items:center;font-size:26px;overflow:hidden;flex:none;margin-bottom:6px}
.item .th{margin:0}.th img{width:100%;height:100%;object-fit:cover}
.chip{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 14px;font-weight:600;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.total{font-size:36px;font-weight:700;letter-spacing:-.03em}
.code{font:600 11px ui-monospace,SFMono-Regular,monospace;color:var(--mut);background:var(--bg);border-radius:5px;padding:1px 6px;display:inline-block;align-self:flex-start;letter-spacing:.03em}
.badge{display:inline-block;border-radius:6px;padding:2px 9px;font-size:12px;font-weight:600;color:#fff}
.b-ok{background:var(--mint)}.b-low{background:var(--sun)}.b-out{background:var(--red)}
.item{display:flex;gap:12px;align-items:center}.item>div:nth-child(2){flex:1;min-width:0}
.alert{background:color-mix(in srgb,var(--sun) 14%,var(--card));border:1px solid color-mix(in srgb,var(--sun) 50%,transparent);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-weight:600;font-size:14px}
.bar{display:grid;grid-template-columns:96px 1fr 40px;gap:10px;align-items:center;margin:8px 0;font-size:14px}
.bar div{background:var(--bg);border-radius:99px;height:10px;overflow:hidden}.bar i{display:block;height:100%;border-radius:99px;transition:width .5s}
.bar b{text-align:right}
.cols{display:flex;align-items:flex-end;gap:4px;height:120px}.cols div{flex:1;text-align:center;font-size:10px;color:var(--mut);display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.cols i{display:block;background:var(--acc);border-radius:4px 4px 0 0;min-height:2px}
.mo{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:480px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:22px;animation:up .25s}
@media(min-width:700px){.mo{align-items:center}.sheet{border-radius:18px}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.rc{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:14px 0}
.rc .ln{padding:12px 14px;border-bottom:1px solid var(--line)}.rc .ln:last-child{border:0}
.rc .in b{color:var(--mint)}.rc .out{font-size:17px;font-weight:700}.rc .out b{color:var(--red);font-size:22px}
.rc .net{background:var(--bg);font-weight:700}
.rch{text-align:center;margin-bottom:4px}.rch .ic{color:var(--mint)}
.okfx{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(5,150,105,.96);color:#fff;text-align:center;animation:fo 1.3s forwards;font-size:26px;font-weight:700}
.okfx .ic{display:block;margin:0 auto 10px;stroke-width:2.4;stroke-dasharray:60;animation:dr .6s forwards}.okfx .amt{font-size:18px;font-weight:500;margin-top:6px;opacity:.9}
@keyframes dr{from{stroke-dashoffset:60}to{stroke-dashoffset:0}}@keyframes fo{0%,75%{opacity:1}100%{opacity:0}}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:10px;font-weight:600;font-size:14px;z-index:70;max-width:92%;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast.bad{background:var(--red);color:#fff}
textarea{width:100%;height:180px;font:12px ui-monospace,monospace;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px}
.menu{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:10px;font-weight:600;font-size:15px;box-shadow:var(--sh)}
.menu span{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--pri) 12%,transparent);color:var(--pri);flex:none}
@media(min-width:900px){
 .top{display:none}
 nav{top:0;bottom:auto;right:auto;width:248px;border-top:0;border-right:1px solid var(--line);padding:22px 12px}
 .brand{display:flex;align-items:center;gap:10px;padding:0 8px 22px}.brand .logo{width:38px;height:38px}.brand b{font-size:15px}
 .tabs{flex-direction:column;gap:2px}
 nav button{flex:none;flex-direction:row;gap:12px;font-size:14px;padding:11px 12px;border-radius:10px;justify-content:flex-start}
 nav button:hover{background:var(--bg)}nav button.on{background:color-mix(in srgb,var(--pri) 12%,transparent)}
 main{margin-left:248px;max-width:none;padding:36px 40px 40px}main>*{max-width:1000px}

<script>
/* ===== Datos y almacenamiento (localStorage con respaldo en memoria) ===== */
const KEY='feria_yeso_v1';
const demo=()=>({products:[
 {id:1,name:'Osito',emoji:'🧸',cat:'Animales',price:4,cost:1.5,stock0:20},
 {id:2,name:'Corazón',emoji:'❤️',cat:'Decoración',price:3.5,cost:1.2,stock0:15},
 {id:3,name:'Unicornio',emoji:'🦄',cat:'Fantasía',price:5,cost:2,stock0:10},

 {id:5,name:'Figura personalizada',emoji:'🎨',cat:'Personalizado',price:7,cost:3,stock0:8}],
 sales:[],cash:{initial:0,moves:[],counted:''},cfg:{low:5},seq:{p:6,s:1,m:1}});
let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
if(!S||!Array.isArray(S.products))S=demo();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

/* ===== Utilidades y cálculos ===== */
const $=s=>document.querySelector(s);
const num=v=>parseFloat(String(v).replace(',','.'));
const money=n=>'$'+(+n||0).toFixed(2).replace('.',',');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sum=(a,f)=>a.reduce((x,y)=>x+f(y),0);
const dstr=ts=>new Date(ts).toLocaleDateString('en-CA');
const today=()=>dstr(Date.now());
const fT=ts=>new Date(ts).toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'});
const fD=ts=>new Date(ts).toLocaleDateString('es',{day:'2-digit',month:'short'});
const byId=id=>S.products.find(p=>p.id==id);
const sold=p=>sum(S.sales.filter(s=>s.pid==p.id),s=>s.qty);
const stock=p=>p.stock0-sold(p);               // Stock actual = inicial - vendidas
const codeOf=p=>p.code||'FY-'+String(p.id).padStart(3,'0');
const saleCode=s=>s.code||(byId(s.pid)?codeOf(byId(s.pid)):'');
S.products.forEach(p=>{if(!p.code)p.code=codeOf(p)});
const st=p=>{const s=stock(p);return s<=0?'out':s<=S.cfg.low?'low':'ok'};
const profit=s=>s.total-s.cost*s.qty;           // Ganancia = ingresos - costo
const thumb=p=>`<div class="th">${p.img?`<img src="${p.img}" alt="">`:(p.emoji||'🎨')}</div>`;
const badge=p=>{const k=st(p);return `<span class="badge b-${k}">${k=='ok'?'Disponible':k=='low'?'Stock bajo':'Agotado'}</span>`};
const bars=(rows,color)=>{const m=Math.max(1,...rows.map(r=>r.v));return rows.length?rows.map(r=>`<div class="bar"><span>${esc(r.l)}</span><div><i style="width:${r.v/m*100}%;background:${color||'var(--pri)'}"></i></div><b>${r.v}</b></div>`).join(''):'<p class="mut">Aún no hay datos.</p>'};

const cashNow=()=>{const M=S.cash.moves;return (+S.cash.initial||0)+sum(S.sales.filter(s=>dstr(s.ts)===today()&&s.method=='Efectivo'),s=>s.total)+sum(M.filter(m=>m.type=='in'),m=>m.amt)-sum(M.filter(m=>m.type!='in'),m=>m.amt)};
/* ===== UI base: modal, toast, confirmación ===== */

function closeM(){const m=$('#mo');if(m)m.remove()}
function ask(msg,ok='Confirmar'){return new Promise(r=>{openM(`<h3>${msg}</h3><div class="row"><button class="btn ghost" id="n">Cancelar</button><button class="btn danger" id="y">${ok}</button></div>`);$('#y').onclick=()=>{closeM();r(true)};$('#n').onclick=()=>{closeM();r(false)}})}

/* ===== INICIO / Dashboard ===== */
function home(){
 const ts=S.sales.filter(s=>dstr(s.ts)===today());
 const top=[...S.products].sort((a,b)=>sold(b)-sold(a))[0];
 const low=S.products.filter(p=>st(p)!=='ok');
 const hrs=ts.map(s=>new Date(s.ts).getHours());
 const h0=Math.min(9,...hrs),h1=Math.max(17,...hrs);
 let cols='';const byH={};ts.forEach(s=>{const h=new Date(s.ts).getHours();byH[h]=(byH[h]||0)+s.total});
 const mx=Math.max(1,...Object.values(byH));
 for(let h=h0;h<=h1;h++)cols+=`<div><i style="height:${(byH[h]||0)/mx*100}px"></i>${h}h</div>`;
 return `<h2>Hoy en la feria</h2>
 <div class="grid">
  <div class="card hero"><small>Ventas del día</small><b>${money(sum(ts,s=>s.total))}</b><button class="btn light sm" onclick="go('sell')">${ic('cart',16)} Nueva venta</button></div>
  <div class="card kpi"><small>Unidades vendidas</small><b>${sum(ts,s=>s.qty)}</b></div>
  <div class="card kpi"><small>Ganancia estimada</small><b>${money(sum(ts,profit))}</b></div>
  <div class="card kpi"><small>Inventario</small><b>${sum(S.products,stock)}</b></div>
  <div class="card kpi"><small>Más vendido</small><b style="font-size:20px">${top&&sold(top)?esc(top.name):'—'}</b></div>
 </div>
 <button class="btn mint big" style="margin-bottom:14px" onclick="go('exp')">${ic('down',18)} Cerrar el día y exportar a Excel</button>
 ${low.length?`<div class="card"><h3>Stock bajo</h3>${low.map(p=>`<div class="alert ${st(p)=='out'?'':'pulse'}">${esc(p.name)}: ${stock(p)<=0?'agotado':'solo '+stock(p)+' unidades'}</div>`).join('')}</div>`:''}
 <div class="card"><h3>Ventas por producto</h3>${bars(S.products.map(p=>({l:p.name,v:sold(p)})).sort((a,b)=>b.v-a.v))}</div>
 <div class="card"><h3>Ventas de hoy por hora ($)</h3><div class="cols">${cols}</div></div>
 <div class="card"><h3>Distribución de inventario</h3>${bars(S.products.map(p=>({l:p.name,v:Math.max(0,stock(p))})),'var(--mint)')}</div>`;
}

/* ===== NUEVA VENTA ===== */
let SL={pid:null,qty:1,price:'',method:'Efectivo',recv:'',disc:''};
const METHODS=[['Efectivo','cash'],['Tarjeta','card'],['Transferencia','swap'],['Otro','dots']];
function pick(id){const p=byId(id);SL={pid:id,qty:1,price:p.price,method:SL.method,recv:'',disc:''};render()}
function sellView(){
 const p=byId(SL.pid);
 let h=`<h2>Nueva venta</h2>`;
 if(!S.products.length)return h+'<div class="card">Primero agrega figuras en Inventario.</div>';
 h+=`<div class="pgrid">`+S.products.map(q=>{const s=stock(q);return `<button class="pick ${q.id==SL.pid?'on':''}" ${s<=0?'disabled':''} onclick="pick(${q.id})">${thumb(q)}<b>${esc(q.name)}</b><span class="code">${codeOf(q)}</span><small>${money(q.price)} · ${s<=0?'Agotado':s+' disp.'}</small></button>`}).join('')+`</div>`;
 if(!p)return h+'<p class="mut">Toca una figura para empezar.</p>';
 return h+`<div class="card"><div class="item">${thumb(p)}<div><b>${esc(p.name)}</b> <span class="code">${codeOf(p)}</span><div class="mut">Disponibles: ${stock(p)}</div></div></div>
 <label>Cantidad</label>
 <div class="row"><button class="chip" style="flex:0 0 52px" onclick="stepQ(-1)"></button><input id="qty" type="number" inputmode="numeric" min="1" value="${SL.qty}" oninput="SL.qty=this.value;sc()"><button class="chip" style="flex:0 0 52px" onclick="stepQ(1)">+</button></div>
 <div class="row" style="margin-top:8px">${[1,2,3,5].map(n=>`<button class="chip" onclick="stepQ(${n})">+${n}</button>`).join('')}</div>
 <label>Precio unitario ($)</label><input id="pr" type="text" inputmode="decimal" value="${SL.price}" oninput="SL.price=this.value;sc()">
 <label>Descuento (%)</label><input id="dc" type="text" inputmode="decimal" placeholder="0" value="${SL.disc}" oninput="SL.disc=this.value;sc()">
 <div class="row" style="margin-top:8px">${[0,5,10,15,20].map(n=>`<button class="chip dchip ${String(SL.disc)==String(n)||(n==0&&SL.disc==='')?'on':''}" data-d="${n}" onclick="setD(${n==0?"''":n})">${n==0?'Sin desc.':n+'%'}</button>`).join('')}</div>
 <div style="margin-top:12px" class="mut">Total</div><div class="mut" id="dsb" style="font-size:14px"></div><div class="total" id="tot"></div>
 <label>Método de pago</label>
 <div class="row">${METHODS.map(m=>`<button class="chip ${SL.method==m[0]?'on':''}" onclick="SL.method='${m[0]}';render()">${ic(m[1],18)} ${m[0]}</button>`).join('')}</div>
 ${SL.method=='Efectivo'?`<label>Efectivo recibido ($)</label><input id="rc" type="text" inputmode="decimal" value="${SL.recv}" oninput="SL.recv=this.value;sc()">
 <div class="row" style="margin-top:8px"><button class="chip" onclick="setR('x')">Exacto</button>${[5,10,20].map(n=>`<button class="chip" onclick="setR(${n})">$${n}</button>`).join('')}</div>
 <label>Movimiento de efectivo</label><div class="rc" id="chg"></div>`:''}
 <button class="btn mint big" style="margin-top:14px" onclick="confirmSale()">${ic('check',18)} Confirmar venta</button></div>
`;
}
const dsc=()=>{const d=num(SL.disc);return isNaN(d)?0:Math.min(100,Math.max(0,d))};
const tot=()=>+((num(SL.qty)||0)*(num(SL.price)||0)*(1-dsc()/100)).toFixed(2);
function setD(n){SL.disc=n;const i=$('#dc');if(i)i.value=n;sc();document.querySelectorAll('.dchip').forEach(b=>b.classList.toggle('on',b.dataset.d==(n===''?'0':String(n))))}
function stepQ(n){SL.qty=Math.max(1,(parseInt(SL.qty)||0)+n);$('#qty').value=SL.qty;sc()}
function setR(n){SL.recv=n=='x'?tot().toFixed(2):n;$('#rc').value=SL.recv;sc()}
function sc(){ // actualiza total y cambio sin re-dibujar
 if(!$('#tot'))return;const sub=(num(SL.qty)||0)*(num(SL.price)||0),t=tot();$('#tot').textContent=money(t);const ds=$('#dsb');if(ds)ds.textContent=dsc()>0?`Subtotal ${money(sub)} − ${dsc()}% (${money(sub-t)})`:'';
 const c=$('#chg');if(c){const r=num(SL.recv);c.innerHTML=isNaN(r)?'<div class="ln mut">Ingresa el efectivo recibido</div>':r<t?`<div class="ln bad"><span>Faltan</span><b>${money(t-r)}</b></div>`:`<div class="ln in"><span>Entra a caja (recibido)</span><b>+${money(r)}</b></div><div class="ln out"><span>Sale de caja (vuelto)</span><b>−${money(r-t)}</b></div><div class="ln net"><span>Queda en caja por esta venta</span><b>${money(t)}</b></div>`}
}
function confirmSale(){
 const p=byId(SL.pid),q=num(SL.qty),pr=num(SL.price);
 if(!p)return toast('Elige una figura.',1);
 if(!Number.isInteger(q)||q<1)return toast('La cantidad debe ser un entero mayor a 0.',1);
 if(isNaN(pr)||pr<0)return toast('El precio no puede ser negativo.',1);
 if(q>stock(p))return toast(`Solo hay ${stock(p)} de ${p.name}.`,1);
 const d=SL.disc===''?0:num(SL.disc);if(isNaN(d)||d<0||d>100)return toast('El descuento debe estar entre 0 y 100%.',1);
 const total=+(q*pr*(1-d/100)).toFixed(2);let recv=null,change=null;
 if(SL.method=='Efectivo'){recv=num(SL.recv);if(isNaN(recv)||recv<total)return toast('El efectivo recibido es menor al total.',1);change=+(recv-total).toFixed(2)}
 S.sales.push({id:S.seq.s,ts:Date.now(),pid:p.id,code:codeOf(p),name:p.name,qty:q,price:pr,disc:d,cost:p.cost,total,method:SL.method,recv,change});
 S.seq.s++;save();
 const left=stock(p),sale=S.sales[S.sales.length-1];
 if(sale.method=='Efectivo')receipt(sale);
 else{const fx=document.createElement('div');fx.className='okfx';fx.innerHTML=`<div>${ic('check',72)}<div>Venta registrada</div><div class="amt">${money(total)} · ${sale.method}</div></div>`;document.body.appendChild(fx);setTimeout(()=>fx.remove(),1300)}
 if(left<=S.cfg.low)setTimeout(()=>toast(`${p.name} ${left<=0?'se agotó':'tiene solo '+left+' unidades'}.`,1),1400);
 SL={pid:null,qty:1,price:'',method:SL.method,recv:'',disc:''};render();
}

function receipt(v){openM(`<div class="rch">${ic('check',44)}<h3 style="margin:6px 0 0">Venta #${v.id} registrada</h3><div class="mut">${saleCode(v)} · ${esc(v.name)} ×${v.qty}</div></div>
 <div class="rc">${v.disc>0?`<div class="ln"><span>Descuento</span><b>${v.disc}%</b></div>`:''}<div class="ln"><span>Total de la venta</span><b>${money(v.total)}</b></div>
 <div class="ln in"><span>Entró a caja (recibido)</span><b>+${money(v.recv)}</b></div>
 <div class="ln out"><span>Salió de caja (vuelto)</span><b>−${money(v.change)}</b></div>
 <div class="ln net"><span>Quedó en caja por esta venta</span><b>${money(v.total)}</b></div></div>
 <div class="ln mut"><span>Efectivo en caja ahora</span><b>${money(cashNow())}</b></div>
 <button class="btn big" style="margin-top:10px" onclick="closeM()">Listo</button>`)}
/* ===== INVENTARIO y gestión de productos ===== */
let IQ='';
function inv(){
 const list=S.products.filter(p=>(p.name+p.cat+codeOf(p)).toLowerCase().includes(IQ.toLowerCase()));
 return `<h2>Inventario</h2><div class="row" style="margin-bottom:12px"><input placeholder="Buscar figura" value="${esc(IQ)}" oninput="IQ=this.value;invList()" style="flex:3"><button class="btn" onclick="prodForm()">${ic('plus',16)} Agregar</button></div>
 <div id="il">${invCards(list)}</div>`;
}

function caja(){
 const ts=S.sales.filter(s=>dstr(s.ts)===today()),by=m=>sum(ts.filter(s=>s.method==m),s=>s.total);
 const M=S.cash.moves,ent=sum(M.filter(m=>m.type=='in'),m=>m.amt),sal=sum(M.filter(m=>m.type!='in'),m=>m.amt);

 return `<h2>Caja</h2><div class="grid"><div class="card kpi"><small>Efectivo</small><b>${money(by('Efectivo'))}</b></div><div class="card kpi"><small>Tarjeta</small><b>${money(by('Tarjeta'))}</b></div><div class="card kpi"><small>Transferencias</small><b>${money(by('Transferencia'))}</b></div><div class="card kpi"><small>Ventas totales</small><b>${money(sum(ts,s=>s.total))}</b></div></div>

 <button class="btn sm" style="margin-top:8px" onclick="addMove()">Agregar movimiento</button>
 ${M.map(m=>`<div class="row" style="margin-top:8px"><span>${m.type=='in'?'Entrada':m.type=='out'?'Salida':'Gasto'}: ${esc(m.desc||'')}</span><b style="text-align:right">${money(m.amt)}</b><button class="btn sm ghost" style="flex:0" onclick="delMove(${m.id})">${ic('x',14)}</button></div>`).join('')}</div>
 <div class="card"><h3>Cierre de caja</h3>
 <div class="ln"><span>Dinero inicial</span><b>${money(S.cash.initial)}</b></div>

let XD=today();
function sheets(d){ // d='' => todas las fechas
 const L=S.sales.filter(s=>!d||dstr(s.ts)===d),by=m=>sum(L.filter(s=>s.method==m),s=>s.total);
